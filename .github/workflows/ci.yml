name: CI Pipeline

on:
  push:
    branches: [ main, 'refactor/**' ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run backend tests
        working-directory: sav-backend
        run: mvn clean test

  frontend:
    name: Frontend Type-check, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sav-frontend/front-tickets/package-lock.json

      - name: Install dependencies
        working-directory: sav-frontend/front-tickets
        run: npm ci

      - name: Run TypeScript type checking
        working-directory: sav-frontend/front-tickets
        run: npm run type-check

      - name: Run ESLint
        working-directory: sav-frontend/front-tickets
        run: npm run lint

      - name: Run production build
        working-directory: sav-frontend/front-tickets
        run: npm run build
